name: Fetch AniOneAsia Metadata

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run fetcher
        run: python fetch_anioneasia.py

      - name: Upload DB to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: db-latest
          name: "AniOneAsia DB $(date -u +%F)"
          files: anioneasia.db
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
