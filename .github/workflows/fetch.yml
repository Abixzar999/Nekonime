name: Fetch AniOneAsia Metadata

on:
  schedule:
    - cron: '0 3 * * *'   # tiap jam 03:00 UTC
  workflow_dispatch:      # bisa jalanin manual di tab Actions

permissions:
  contents: write         # butuh izin push artifact / commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run fetcher
        run: python fetch_anioneasia.py

      - name: Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: anioneasia-db
          path: anioneasia.db
          retention-days: 30

